# Déploiement Hostinger (mutualisé) — sous-domaine via SSH + rsync
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, pdo, sqlite

      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan test

  build-and-deploy:
    name: Build et déploiement SSH (Hostinger)
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, pdo, mysql, gd, zip

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Configure SSH (clé déploy)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 65002 }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Deploy via rsync (SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 65002 }}
          SSH_DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || [ -z "${SSH_DEPLOY_PATH}" ]; then
            echo "::error::Secrets SSH requis : SSH_HOST, SSH_USER, SSH_DEPLOY_PATH (+ SSH_PASSWORD ou SSH_PRIVATE_KEY)"
            exit 1
          fi

          if [ -f ~/.ssh/deploy_key ]; then
            RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
            SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          else
            if [ -z "${SSHPASS:-}" ]; then
              echo "::error::Renseignez SSH_PASSWORD ou SSH_PRIVATE_KEY dans les secrets GitHub"
              exit 1
            fi
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
            RSYNC_RSH="sshpass -e ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no"
            SSH_CMD="sshpass -e ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no"
          fi

          REMOTE="${SSH_USER}@${SSH_HOST}:${SSH_DEPLOY_PATH}/"
          echo "→ rsync vers ${REMOTE}"

          rsync -avz \
            --exclude-from=deploy/rsync-excludes.txt \
            -e "${RSYNC_RSH}" \
            ./ "${REMOTE}"

      - name: Post-deploy Artisan (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}"
            chmod -R ug+rwx storage bootstrap/cache 2>/dev/null || true
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
