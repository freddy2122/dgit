# Déploiement Hostinger (mutualisé) — sous-domaine via FTP/FTPS
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, pdo, sqlite

      - run: composer install --no-interaction --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan test

  build-and-deploy:
    name: Build et envoi FTP (Hostinger)
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, json, pdo, mysql, gd, zip

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Deploy to Hostinger (FTP/FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          log-level: minimal
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/.editorconfig
            **/phpunit.xml
            **/.phpunit.cache/**
            **/storage/logs/**
            !**/.env.example

      # Optionnel : si votre offre Hostinger inclut SSH (hPanel → Avancé → SSH)
      - name: Post-deploy Artisan (SSH optionnel Hostinger)
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_PASSWORD != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.SSH_DEPLOY_PATH }}"
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
